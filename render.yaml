services:
  - type: web
    name: paywise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --workers 1, pinned explicitly rather than relying on gunicorn's
    # (also 1, but unstated) default: server.py's `sessions` dict lives in
    # process memory, so a second worker - or a second horizontally-scaled
    # instance on a paid plan - would have its own separate copy, and a
    # session created on one could get "unknown session_id" from another
    # depending purely on which one a later request happened to land on.
    # Real fix for real multi-instance use would be an external session
    # store (Redis, etc.) - out of scope for this demo surface.
    startCommand: gunicorn server:app --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional: enables LLM-based understanding + phrasing (see README
      # "Configuration"). All secrets below are sync: false so Render
      # prompts for the value once in its dashboard - never committed to
      # the repo. The agent runs fully on its deterministic fallback
      # without any of this configured.
      #
      # Primary provider: OpenAI. Leave LLM_API_KEY blank at deploy time
      # to skip the LLM path entirely; the non-secret settings below only
      # matter once a key is actually set.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_USES_REASONING_EFFORT
        value: "false"
      # Fallback provider: Groq, tried only if the OpenAI call itself
      # fails. Also optional - leave LLM_FALLBACK_API_KEY blank to run
      # with a single provider (OpenAI) and no fallback.
      - key: LLM_FALLBACK_API_KEY
        sync: false
      - key: LLM_FALLBACK_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_FALLBACK_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_FALLBACK_USES_REASONING_EFFORT
        value: "true"
      - key: LLM_FALLBACK_SUPPORTS_FORCED_TOOL_CHOICE
        value: "false"
